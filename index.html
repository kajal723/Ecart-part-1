
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Price Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Smart Price Finder</h1>
        <p class="subtitle">
            Find products closest to your budget
        </p>

       
<div class="search-box">
    <h2>Find Products by Price</h2>

    <label for="minPrice">Minimum Price (₹)</label>
    <input
        type="number"
        id="minPrice"
        placeholder="e.g. 60000"
        min="0"
    >

    <label for="maxPrice">Maximum Price (₹)</label>
    <input
        type="number"
        id="maxPrice"
        placeholder="e.g. 75000"
        min="0"
    >

    <button onclick="searchByRange()">
        Search Products
    </button>
</div>

<h2>Products Within Your Budget</h2>

<div id="productList" class="product-list">
    <p>Enter a price range and click Search.</p>
</div>

        <h2>Closest Products</h2>

        <div id="productList" class="product-list">
            <p>Enter a price and click Search.</p>
        </div>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
